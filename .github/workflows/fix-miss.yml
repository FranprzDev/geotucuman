name: fix-miss

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'miss-report issue number to process'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: miss-fix-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  fix:
    if: contains(github.event.issue.labels.*.name, 'miss-report') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Process the miss report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: npx tsx scripts/fix-miss.ts --issue ${{ github.event.issue.number || github.event.inputs.issue_number }}
