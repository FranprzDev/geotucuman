name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate catalog
        run: npm run validate-catalog

      - name: Documentation consistency
        run: npm run test:docs

      - name: ArcGIS offline tests
        run: npx tsx scripts/arcgis-test.ts

      - name: Search relevance tests
        run: npx tsx scripts/search-test.ts

      - name: Build
        run: npm run build

      - name: Worker smoke test
        run: npm run worker:smoke
